name: Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@^11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name README.md | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pending.outputs.has_changesets == 'true'
        run: pnpm run changeset:version
      - if: steps.pending.outputs.has_changesets == 'true'
        run: pnpm install --lockfile-only
      - if: steps.pending.outputs.has_changesets == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml CHANGELOG.md .changeset
          git commit -m "chore: version packages [skip ci]"
          git push
      - if: steps.pending.outputs.has_changesets == 'true'
        run: pnpm changeset publish
      - if: steps.pending.outputs.has_changesets == 'true'
        run: git push --follow-tags
      - if: steps.pending.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
